[project]
name = "track-anywhere"
version = "0.1.0"
description = "Personal accounting system with a strict ledger core and draft-first capture."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.11",
  "python-multipart>=0.0.20",
  "sqlalchemy>=2.0",
  "uvicorn>=0.41",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4",
  "httpx>=0.27",
]
postgres = [
  "psycopg[binary]>=3.2",
]

[project.scripts]
ta = "track_anywhere_cli.main:main"
track-anywhere = "track_anywhere_cli.main:main"

[tool.setuptools.packages.find]
where = ["backend/app", "cli"]
include = ["track_anywhere*", "track_anywhere_cli*"]

[tool.pytest.ini_options]
pythonpath = ["backend/app", "cli"]
testpaths = ["backend/tests", "cli/tests"]
addopts = "-q"
