[project]
name = "track-anywhere"
version = "0.1.0"
description = "Personal accounting system with a strict ledger core and draft-first capture."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13",
  "authlib>=1.6.6",
  "click>=8.3.3",
  "django>=6.0",
  "django-allauth[socialaccount]>=65.0",
  "django-filter>=25.0",
  "django-guardian>=3.0",
  "django-ninja>=1.6",
  "djangorestframework>=3.16",
  "fastapi>=0.115",
  "itsdangerous>=2.2",
  "pydantic>=2.11",
  "python-multipart>=0.0.20",
  "rich>=15.0.0",
  "sqlalchemy>=2.0",
  "uvicorn>=0.41",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4",
  "httpx>=0.27",
]
postgres = [
  "psycopg[binary]>=3.2",
]

[project.scripts]
ta = "track_anywhere_cli.main:main"
track-anywhere = "track_anywhere_cli.main:main"

[tool.setuptools.packages.find]
where = ["backend/app", "cli"]
include = ["track_anywhere*", "track_anywhere_cli*"]

[tool.pytest.ini_options]
pythonpath = ["backend/app", "cli"]
testpaths = ["backend/tests", "backend_django/tests", "cli/tests", "contract_tests"]
addopts = "-q"
