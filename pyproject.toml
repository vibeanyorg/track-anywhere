[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "track-anywhere"
version = "0.2.3"
description = "Personal accounting system with a strict PostgreSQL event-ledger core."
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.13",
  "authlib>=1.6.6",
  "click>=8.3.3",
  "cryptography>=48",
  "fastapi>=0.115",
  "httpx>=0.27",
  "itsdangerous>=2.2",
  "mcp>=1.28.1,<2",
  "pydantic>=2.11",
  "python-multipart>=0.0.31",
  "rich>=15.0.0",
  "sqlalchemy>=2.0",
  "starlette>=1.3.1,<2",
  "uvicorn>=0.41",
]

[project.optional-dependencies]
postgres = [
  "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
  "pytest>=8.4",
]

[project.scripts]
ta = "track_anywhere_cli.main:main"
track-anywhere = "track_anywhere_cli.main:main"

[tool.setuptools.packages.find]
where = ["backend/app", "cli"]
include = ["track_anywhere*", "track_anywhere_cli*"]

[tool.setuptools.package-data]
"track_anywhere.serialization" = ["schemas/*.json"]

[tool.pytest.ini_options]
pythonpath = ["backend/app", "cli"]
testpaths = ["backend/tests", "cli/tests", "contract_tests"]
addopts = "-q"
