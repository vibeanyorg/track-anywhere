name: track-anywhere-prod

services:
  api:
    image: ${TRACK_ANYWHERE_API_IMAGE:-ghcr.io/vibeanyorg/track-anywhere-api:latest}
    container_name: track-anywhere-prod-api
    env_file:
      - ${TRACK_ANYWHERE_PROD_ENV_FILE:-deploy/env/prod.env}
    environment:
      TRACK_ANYWHERE_MODE: production
      PYTHONUNBUFFERED: "1"
    depends_on:
      clamav:
        condition: service_started
    ports:
      - "${TRACK_ANYWHERE_PROD_API_BIND:-127.0.0.1}:${TRACK_ANYWHERE_PROD_API_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  clamav:
    image: clamav/clamav:stable
    container_name: track-anywhere-prod-clamav
    volumes:
      - clamav-data:/var/lib/clamav
    restart: unless-stopped

  web:
    image: ${TRACK_ANYWHERE_WEB_IMAGE:-ghcr.io/vibeanyorg/track-anywhere-web:latest}
    container_name: track-anywhere-prod-web
    env_file:
      - ${TRACK_ANYWHERE_PROD_ENV_FILE:-deploy/env/prod.env}
    environment:
      TRACK_ANYWHERE_BACKEND_URL: http://api:8000
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NEXT_TELEMETRY_DISABLED: "1"
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${TRACK_ANYWHERE_PROD_WEB_BIND:-127.0.0.1}:${TRACK_ANYWHERE_PROD_WEB_PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  cli:
    image: ${TRACK_ANYWHERE_API_IMAGE:-ghcr.io/vibeanyorg/track-anywhere-api:latest}
    profiles: ["cli"]
    env_file:
      - ${TRACK_ANYWHERE_PROD_ENV_FILE:-deploy/env/prod.env}
    environment:
      TRACK_ANYWHERE_API: http://api:8000
      TRACK_ANYWHERE_SERVICE_URL: http://api:8000
    entrypoint: ["ta"]

volumes:
  clamav-data:
