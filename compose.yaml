services:
  postgres:
    image: postgres:16-alpine
    container_name: track-anywhere-postgres
    environment:
      POSTGRES_DB: track_anywhere
      POSTGRES_USER: track_anywhere
      POSTGRES_PASSWORD: track_anywhere
    ports:
      - "${TRACK_ANYWHERE_POSTGRES_PORT:-55432}:5432"
    volumes:
      - ./.local/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U track_anywhere -d track_anywhere"]
      interval: 5s
      timeout: 3s
      retries: 12
