name: track-anywhere-dev

services:
  postgres:
    image: postgres:17-alpine
    container_name: track-anywhere-v2-dev-postgres17
    environment:
      POSTGRES_DB: track_anywhere
      POSTGRES_USER: track_anywhere
      POSTGRES_PASSWORD: track_anywhere
      TRACK_ANYWHERE_OWNER_ROLE: ${TRACK_ANYWHERE_OWNER_ROLE:-track_anywhere_owner}
      TRACK_ANYWHERE_MIGRATOR_ROLE: ${TRACK_ANYWHERE_MIGRATOR_ROLE:-track_anywhere_migrator}
      TRACK_ANYWHERE_MIGRATOR_PASSWORD: ${TRACK_ANYWHERE_MIGRATOR_PASSWORD:-track_anywhere_migrator_test}
      TRACK_ANYWHERE_RUNTIME_ROLE: ${TRACK_ANYWHERE_RUNTIME_ROLE:-track_anywhere_runtime}
      TRACK_ANYWHERE_RUNTIME_PASSWORD: ${TRACK_ANYWHERE_RUNTIME_PASSWORD:-track_anywhere_runtime_test}
    ports:
      - "${TRACK_ANYWHERE_DEV_POSTGRES_PORT:-55432}:5432"
    volumes:
      - track-anywhere-v2-postgres17:/var/lib/postgresql/data
      - ./docker/postgres/init/001-v2-roles.sh:/docker-entrypoint-initdb.d/001-v2-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U track_anywhere -d track_anywhere"]
      interval: 5s
      timeout: 3s
      retries: 12

  bootstrap:
    image: postgres:17-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPASSWORD: track_anywhere
      POSTGRES_DB: track_anywhere
      POSTGRES_USER: track_anywhere
      TRACK_ANYWHERE_OWNER_ROLE: ${TRACK_ANYWHERE_OWNER_ROLE:-track_anywhere_owner}
      TRACK_ANYWHERE_MIGRATOR_ROLE: ${TRACK_ANYWHERE_MIGRATOR_ROLE:-track_anywhere_migrator}
      TRACK_ANYWHERE_MIGRATOR_PASSWORD: ${TRACK_ANYWHERE_MIGRATOR_PASSWORD:-track_anywhere_migrator_test}
      TRACK_ANYWHERE_RUNTIME_ROLE: ${TRACK_ANYWHERE_RUNTIME_ROLE:-track_anywhere_runtime}
      TRACK_ANYWHERE_RUNTIME_PASSWORD: ${TRACK_ANYWHERE_RUNTIME_PASSWORD:-track_anywhere_runtime_test}
    volumes:
      - ./docker/postgres/init/001-v2-roles.sh:/bootstrap/001-v2-roles.sh:ro
    entrypoint: ["bash", "/bootstrap/001-v2-roles.sh"]
    restart: "no"

  migrate:
    build:
      context: .
      target: api-runtime
    image: ${TRACK_ANYWHERE_DEV_IMAGE:-track-anywhere:dev}
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      TRACK_ANYWHERE_MODE: local
      TRACK_ANYWHERE_DATABASE_URL: postgresql+psycopg://${TRACK_ANYWHERE_MIGRATOR_ROLE:-track_anywhere_migrator}:${TRACK_ANYWHERE_MIGRATOR_PASSWORD:-track_anywhere_migrator_test}@postgres:5432/track_anywhere
      TRACK_ANYWHERE_DB_RUNTIME_ROLE: ${TRACK_ANYWHERE_RUNTIME_ROLE:-track_anywhere_runtime}
      PYTHONUNBUFFERED: "1"
    command: ["python", "-m", "alembic", "upgrade", "head"]
    restart: "no"

  api:
    build:
      context: .
      target: api-runtime
    image: ${TRACK_ANYWHERE_DEV_IMAGE:-track-anywhere:dev}
    container_name: track-anywhere-dev-api
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      TRACK_ANYWHERE_MODE: local
      TRACK_ANYWHERE_DATABASE_URL: postgresql+psycopg://${TRACK_ANYWHERE_RUNTIME_ROLE:-track_anywhere_runtime}:${TRACK_ANYWHERE_RUNTIME_PASSWORD:-track_anywhere_runtime_test}@postgres:5432/track_anywhere
      TRACK_ANYWHERE_ALLOWED_ORIGINS: ${TRACK_ANYWHERE_ALLOWED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      TRACK_ANYWHERE_PUBLIC_BASE_URL: ${TRACK_ANYWHERE_PUBLIC_BASE_URL:-http://127.0.0.1:8000}
      TRACK_ANYWHERE_PROJECTION_POLL_SECONDS: ${TRACK_ANYWHERE_PROJECTION_POLL_SECONDS:-2}
      TRACK_ANYWHERE_MAX_REQUEST_BODY_BYTES: ${TRACK_ANYWHERE_MAX_REQUEST_BODY_BYTES:-1048576}
      PYTHONUNBUFFERED: "1"
    ports:
      - "${TRACK_ANYWHERE_DEV_API_BIND:-127.0.0.1}:${TRACK_ANYWHERE_DEV_API_PORT:-8000}:8000"
    stop_grace_period: 65s
    restart: unless-stopped

  cli:
    build:
      context: .
      target: api-runtime
    image: ${TRACK_ANYWHERE_DEV_IMAGE:-track-anywhere:dev}
    profiles: ["cli"]
    depends_on:
      api:
        condition: service_started
    environment:
      TRACK_ANYWHERE_API: http://api:8000
      TRACK_ANYWHERE_SERVICE_URL: http://api:8000
    entrypoint: ["ta"]

volumes:
  track-anywhere-v2-postgres17:
