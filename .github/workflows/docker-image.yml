name: Docker images

on:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: Image channel to build
        required: true
        default: nightly
        type: choice
        options:
          - nightly
          - stable

permissions:
  contents: read
  packages: write

env:
  PYTHON_VERSION: "3.12"
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  unit:
    name: Unit and contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra postgres --dev
      - run: uv run pytest

  docker-postgres-e2e:
    name: Docker Postgres E2E
    runs-on: ubuntu-latest
    needs: unit
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.channel == 'stable')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra postgres --dev
      - run: scripts/e2e-docker-postgres.sh

  build-nightly:
    name: Build nightly image
    runs-on: ubuntu-latest
    needs: unit
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.channel == 'nightly')
    strategy:
      matrix:
        include:
          - target: api-runtime
            image: ghcr.io/vibeanyorg/track-anywhere-api
          - target: web-runtime
            image: ghcr.io/vibeanyorg/track-anywhere-web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=nightly
            type=sha,prefix=nightly-sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-stable:
    name: Build stable image
    runs-on: ubuntu-latest
    needs:
      - unit
      - docker-postgres-e2e
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.channel == 'stable')
    strategy:
      matrix:
        include:
          - target: api-runtime
            image: ghcr.io/vibeanyorg/track-anywhere-api
          - target: web-runtime
            image: ghcr.io/vibeanyorg/track-anywhere-web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=tag,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=stable
            type=sha,prefix=stable-sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
