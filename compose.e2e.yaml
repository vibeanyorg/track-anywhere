services:
  postgres:
    image: ${TRACK_ANYWHERE_POSTGRES_IMAGE:-postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193}
    environment:
      POSTGRES_DB: track_anywhere
      POSTGRES_USER: track_anywhere
      POSTGRES_PASSWORD: track_anywhere
      TRACK_ANYWHERE_OWNER_ROLE: ${TRACK_ANYWHERE_OWNER_ROLE:-track_anywhere_owner}
      TRACK_ANYWHERE_MIGRATOR_ROLE: ${TRACK_ANYWHERE_MIGRATOR_ROLE:-track_anywhere_migrator}
      TRACK_ANYWHERE_MIGRATOR_PASSWORD: ${TRACK_ANYWHERE_MIGRATOR_PASSWORD:-track_anywhere_migrator_test}
      TRACK_ANYWHERE_RUNTIME_ROLE: ${TRACK_ANYWHERE_RUNTIME_ROLE:-track_anywhere_runtime}
      TRACK_ANYWHERE_RUNTIME_PASSWORD: ${TRACK_ANYWHERE_RUNTIME_PASSWORD:-track_anywhere_runtime_test}
    ports:
      - "${TRACK_ANYWHERE_E2E_POSTGRES_BIND:-127.0.0.1}:${TRACK_ANYWHERE_E2E_POSTGRES_PORT:-15543}:5432"
    volumes:
      - postgres17-data:/var/lib/postgresql/data
      - ./docker/postgres/init/001-v2-roles.sh:/docker-entrypoint-initdb.d/001-v2-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U track_anywhere -d track_anywhere"]
      interval: 5s
      timeout: 3s
      retries: 12

  pg17-client:
    image: ${TRACK_ANYWHERE_POSTGRES_IMAGE:-postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193}
    profiles: ["tools"]
    command: ["psql", "--version"]

  migrate:
    build:
      context: .
      target: api-runtime
    image: ${TRACK_ANYWHERE_E2E_API_IMAGE:-track-anywhere-api:e2e}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TRACK_ANYWHERE_MODE: local
      TRACK_ANYWHERE_DATABASE_URL: postgresql+psycopg://${TRACK_ANYWHERE_MIGRATOR_ROLE:-track_anywhere_migrator}:${TRACK_ANYWHERE_MIGRATOR_PASSWORD:-track_anywhere_migrator_test}@postgres:5432/track_anywhere
      TRACK_ANYWHERE_DB_RUNTIME_ROLE: ${TRACK_ANYWHERE_RUNTIME_ROLE:-track_anywhere_runtime}
      PYTHONUNBUFFERED: "1"
    command: ["python", "-m", "alembic", "upgrade", "head"]
    restart: "no"

  api:
    build:
      context: .
      target: api-runtime
    image: ${TRACK_ANYWHERE_E2E_API_IMAGE:-track-anywhere-api:e2e}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TRACK_ANYWHERE_MODE: local
      TRACK_ANYWHERE_DATABASE_URL: postgresql+psycopg://${TRACK_ANYWHERE_RUNTIME_ROLE:-track_anywhere_runtime}:${TRACK_ANYWHERE_RUNTIME_PASSWORD:-track_anywhere_runtime_test}@postgres:5432/track_anywhere
      TRACK_ANYWHERE_ALLOWED_ORIGINS: ${TRACK_ANYWHERE_E2E_PUBLIC_BASE_URL:-http://127.0.0.1:18080}
      TRACK_ANYWHERE_PUBLIC_BASE_URL: ${TRACK_ANYWHERE_E2E_PUBLIC_BASE_URL:-http://127.0.0.1:18080}
      TRACK_ANYWHERE_PROJECTION_POLL_SECONDS: ${TRACK_ANYWHERE_PROJECTION_POLL_SECONDS:-0.25}
      PYTHONUNBUFFERED: "1"
    ports:
      - "${TRACK_ANYWHERE_E2E_API_BIND:-127.0.0.1}:${TRACK_ANYWHERE_E2E_API_PORT:-18080}:8000"
    stop_grace_period: 65s

volumes:
  postgres17-data:
