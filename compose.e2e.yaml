services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: track_anywhere
      POSTGRES_USER: track_anywhere
      POSTGRES_PASSWORD: track_anywhere
    ports:
      - "${TRACK_ANYWHERE_E2E_POSTGRES_BIND:-127.0.0.1}:${TRACK_ANYWHERE_E2E_POSTGRES_PORT:-15543}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U track_anywhere -d track_anywhere"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      target: api-runtime
    image: ${TRACK_ANYWHERE_E2E_API_IMAGE:-track-anywhere-api:e2e}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TRACK_ANYWHERE_MODE: local
      TRACK_ANYWHERE_DATABASE_URL: postgresql+psycopg://track_anywhere:track_anywhere@postgres:5432/track_anywhere
      TRACK_ANYWHERE_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      PYTHONUNBUFFERED: "1"
    ports:
      - "${TRACK_ANYWHERE_E2E_API_BIND:-127.0.0.1}:${TRACK_ANYWHERE_E2E_API_PORT:-18080}:8000"

volumes:
  postgres-data:
